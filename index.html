<!DOCTYPE html>
<html lang="de">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LINKVISION — Fashion & Lifestyle</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #050505;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

/* NAVBAR */

.navbar {
    width: 100%;
    height: 72px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 7%;

    background: #050505;
    border-bottom: 1px solid #202020;
}

.logo {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 3px;
}

.nav-text {
    color: #888;
    font-size: 14px;
}

/* HERO */

.hero {
    min-height: 520px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 80px 7%;

    background:
        radial-gradient(
            circle at center,
            #1c1c1c 0%,
            #0b0b0b 45%,
            #050505 75%
        );

    border-bottom: 1px solid #151515;
}

.hero h1 {
    font-size: clamp(48px, 9vw, 100px);
    font-weight: 900;

    letter-spacing: -5px;

    line-height: 0.95;
}

.hero p {
    margin-top: 25px;

    max-width: 600px;

    color: #999;

    font-size: 17px;
    line-height: 1.6;
}

.hero-button {
    display: inline-block;

    margin-top: 35px;

    padding: 15px 30px;

    background: white;
    color: black;

    border-radius: 10px;

    font-weight: 700;

    transition: 0.2s;
}

.hero-button:hover {
    transform: translateY(-3px);
    background: #dddddd;
}
