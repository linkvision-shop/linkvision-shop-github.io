<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LINKVISION</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #050505;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

a {
    text-decoration: none;
    color: inherit;
}

button {
    font-family: inherit;
}

/* NAVBAR */

.navbar {
    position: sticky;
    top: 0;
    z-index: 100;
    height: 72px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 6%;

    background: rgba(5,5,5,0.92);
    border-bottom: 1px solid #1c1c1c;
    backdrop-filter: blur(15px);
}

.logo {
    font-size: 23px;
    font-weight: 900;
    letter-spacing: 4px;
}

.logo span {
    color: #777;
}

.nav-links {
    display: flex;
    gap: 30px;
    list-style: none;
}

.nav-links a {
    color: #999;
    font-size: 14px;
}

.nav-links a:hover {
    color: white;
}

.nav-right {
    display: flex;
    gap: 8px;
}

.lang-btn,
.menu-btn {
    background: #111;
    border: 1px solid #292929;
    color: white;
    border-radius: 10px;
    padding: 9px 13px;
    cursor: pointer;
}

.menu-btn {
    display: none;
}

/* HERO */

.hero {
    min-height: 570px;

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;
    padding: 80px 20px;

    background:
        radial-gradient(
            circle at center,
            #1d1d1d 0%,
            #0a0a0a 40%,
            #050505 75%
        );
}

.hero-content {
    max-width: 850px;
}

.badge {
    display: inline-block;

    border: 1px solid #303030;
    border-radius: 30px;

    padding: 8px 15px;
    margin-bottom: 25px;

    color: #999;
    font-size: 12px;
    letter-spacing: 2px;
}

.hero h1 {
    font-size: clamp(50px, 8vw, 90px);
    line-height: 0.95;
    letter-spacing: -4px;
}

.hero h1 span {
    color: #777;
}

.hero p {
    max-width: 600px;

    margin: 28px auto;

    color: #999;
    line-height: 1.7;
    font-size: 17px;
}

.hero-buttons {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
}

.primary-btn,
.secondary-btn {
    padding: 14px 22px;
    border-radius: 12px;
    font-weight: 700;
    transition: 0.2s;
}

.primary-btn {
    background: white;
    color: black;
}

.secondary-btn {
    background: #111;
    border: 1px solid #292929;
}

.primary-btn:hover,
.secondary-btn:hover {
    transform: translateY(-2px);
}

/* SECTIONS */

.section {
    padding: 80px 6%;
}

.section-title {
    margin-bottom: 30px;
}

.section-title h2 {
    font-size: 35px;
}

.section-title p {
    color: #777;
    margin-top: 7px;
}

/* CATEGORIES */

.categories {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}

.category {
    min-height: 180px;

    padding: 25px;

    border: 1px solid #202020;
    border-radius: 18px;

    background: linear-gradient(145deg, #151515, #0b0b0b);

    cursor: pointer;

    display: flex;
    flex-direction: column;
    justify-content: flex-end;

    transition: 0.25s;
}

.category:hover {
    transform: translateY(-5px);
    border-color: #444;
}
