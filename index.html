<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LINKVISION — Discover Your Style</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#050505;
    color:#fff;
}

a{
    text-decoration:none;
    color:inherit;
}

button{
    font-family:inherit;
}

/* NAVBAR */

.navbar{
    position:sticky;
    top:0;
    z-index:1000;
    height:72px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 6%;

    background:rgba(5,5,5,.88);
    backdrop-filter:blur(18px);

    border-bottom:1px solid #191919;
}

.logo{
    font-size:23px;
    font-weight:900;
    letter-spacing:4px;
}

.logo span{
    color:#777;
}

.nav-links{
    display:flex;
    gap:32px;
    list-style:none;
}

.nav-links a{
    color:#aaa;
    font-size:14px;
    transition:.2s;
}

.nav-links a:hover{
    color:#fff;
}

.nav-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.lang-btn,
.menu-btn{
    background:#111;
    border:1px solid #292929;
    color:#fff;
    padding:9px 13px;
    border-radius:10px;
    cursor:pointer;
}

.menu-btn{
    display:none;
}

/* HERO */

.hero{
    min-height:570px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:80px 20px;

    background:
        radial-gradient(
            circle at 50% 30%,
            #1b1b1b 0%,
            #090909 38%,
            #050505 70%
        );
}

.hero-content{
    max-width:850px;
}

.badge{
    display:inline-block;

    padding:8px 15px;

    border:1px solid #303030;
    border-radius:30px;

    color:#aaa;

    font-size:12px;
    letter-spacing:2px;

    margin-bottom:25px;
}

.hero h1{
    font-size:clamp(48px,8vw,92px);

    line-height:.95;
    letter-spacing:-4px;

    font-weight:900;
}

.hero h1 span{
    color:#777;
}

.hero p{
    max-width:620px;

    margin:28px auto;

    color:#999;

    font-size:17px;
    line-height:1.7;
}

.hero-buttons{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
}

.primary-btn,
.secondary-btn{

    border-radius:12px;

    padding:14px 22px;

    font-weight:700;

    cursor:pointer;

    transition:.2s;
}

.primary-btn{
    background:#fff;
    color:#000;
    border:1px solid #fff;
}

.primary-btn:hover{
    transform:translateY(-2px);
    background:#ddd;
}

.secondary-btn{
    background:#111;
    color:#fff;
    border:1px solid #292929;
}

.secondary-btn:hover{
    background:#191919;
}

/* SECTIONS */

.section{
    padding:80px 6%;
}

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:end;

    margin-bottom:30px;
}

.section-title h2{
    font-size:35px;
}

.section-title p{
    color:#777;
    font-size:14px;
}

/* CATEGORIES */

.categories{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.category{

    min-height:180px;

    background:
        linear-gradient(
            145deg,
            #151515,
            #0b0b0b
        );

    border:1px solid #202020;

    border-radius:18px;

    padding:25px;

    cursor:pointer;

    transition:.25s;

    display:flex;
    flex-direction:column;
    justify-content:flex-end;
}

.category:hover{
    transform:translateY(-5px);
    border-color:#444;
}

.category-number{
    color:#555;
    font-size:13px;

    margin-bottom:auto;
}

.category h3{
    font-size:23px;
    margin-bottom:8px;
}

.category p{
    color:#777;
    font-size:13px;
}

/* DISCOVER */

.discover{
    background:#090909;
}

.search-box{
    margin:35px 0;

    display:flex;
    gap:10px;
}

.search-box input{

    width:100%;

    padding:16px 18px;

    border-radius:12px;

    border:1px solid #252525;

    outline:none;

    background:#0e0e0e;

    color:#fff;

    font-size:15px;
}

.search-box input:focus{
    border-color:#555;
}

/* PRODUCTS */

.products{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:18px;
}

.product-card{

    background:#0d0d0d;

    border:1px solid #202020;

    border-radius:17px;

    overflow:hidden;

    transition:.25s;
}

.product-card:hover{

    transform:translateY(-5px);

    border-color:#3b3b3b;
}

/* PRODUCT IMAGE */

.product-image{

    height:280px;

    position:relative;

    overflow:hidden;

    background:
        radial-gradient(
            circle,
            #292929,
            #111 55%,
            #080808
        );
}

.product-image img{

    width:100%;
    height:100%;

    object-fit:cover;

    display:block;

    transition:.4s;
}

.product-card:hover
.product-image img{

    transform:scale(1.05);
}

.image-placeholder{

    position:absolute;

    inset:0;

    display:flex;

    align-items:center;

    justify-content:center;

    color:#555;

    font-size:12px;

    letter-spacing:2px;
}

/* PRODUCT INFO */

.product-info{
    padding:18px;
}

.product-category{

    font-size:11px;

    color:#666;

    text-transform:uppercase;

    letter-spacing:1px;

    margin-bottom:8px;
}

.product-name{

    font-size:17px;

    font-weight:700;

    margin-bottom:7px;
}

.product-description{

    color:#777;

    font-size:13px;

    line-height:1.5;

    margin-bottom:16px;
}

    background:#fff;

    color:#000;

    border-radius:9px;

    font-weight:700;

    font-size:13px;

    transition:.2s;
}
